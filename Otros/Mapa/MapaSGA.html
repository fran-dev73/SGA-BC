<!DOCTYPE html>
<!-- Plantilla del mapa de SGA. No se abre directamente: GenerarMapa.ps1 mete los datos en
     DATOS_MAPA y escribe MapaSGA.html. Sin librerías externas: funciona sin conexión.

     Dos vistas, dibujadas en SVG:
     - Plano general: menús -> pantallas -> lógica (codeunits) -> tablas, a nivel de objeto.
     - Recorrido de una pantalla: sus botones y campos -> las funciones que usan -> tablas y
       pantallas que abren. Las funciones propias de la pantalla no se dibujan: se atraviesan. -->
<html lang="es">
<head>
<meta charset="utf-8">
<title>Mapa de SGA</title>
<style>
    * { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; }
    body { display: flex; flex-direction: column; font: 14px "Segoe UI", Roboto, sans-serif; color: #111827; background: #f3f4f6; }

    header { display: flex; align-items: center; gap: 14px; padding: 10px 16px; background: #111827; color: #f9fafb; flex-wrap: wrap; }
    header h1 { margin: 0; font-size: 18px; font-weight: 700; }
    .migas { font-size: 15px; color: #d1d5db; }
    .migas span.enlace { color: #93c5fd; cursor: pointer; }
    .migas span.enlace:hover { text-decoration: underline; }
    .buscador { position: relative; margin-left: auto; width: 380px; }
    .buscador input { width: 100%; padding: 7px 10px; font: inherit; border: none; border-radius: 6px; }
    #resultados { position: absolute; top: 36px; left: 0; right: 0; z-index: 30; max-height: 60vh; overflow-y: auto; background: #fff; border-radius: 6px; box-shadow: 0 8px 24px rgba(0,0,0,.25); color: #111827; display: none; }
    #resultados div { padding: 6px 10px; cursor: pointer; display: flex; align-items: center; gap: 8px; }
    #resultados div:hover { background: #eff6ff; }
    .sinacceso { font-size: 12px; color: #fcd34d; cursor: pointer; }

    #ayuda { padding: 8px 16px; background: #fff; border-bottom: 1px solid #e5e7eb; font-size: 13px; color: #374151; display: flex; gap: 16px; align-items: center; flex-wrap: wrap; min-height: 40px; }
    #ayuda b { color: #111827; }
    .boton { padding: 5px 12px; background: #2563eb; color: #fff; border-radius: 6px; cursor: pointer; font: inherit; font-size: 13px; border: none; }
    .boton.gris { background: #e5e7eb; color: #111827; }
    .leyenda { display: inline-flex; gap: 12px; align-items: center; margin-left: auto; font-size: 12px; color: #4b5563; }
    .leyenda i { display: inline-block; width: 22px; height: 0; border-top: 2px solid; vertical-align: middle; margin-right: 4px; }

    #lienzo { flex: 1; overflow: auto; position: relative; }
    svg text { font-family: "Segoe UI", Roboto, sans-serif; }
    .caja { cursor: pointer; }
    .caja rect.fondo { transition: opacity .15s; }
    .apagado { opacity: .12; }
    .arista { fill: none; transition: opacity .15s; }
    .arista.oculta { display: none; }

    #ficha { position: fixed; top: 0; right: 0; bottom: 0; width: 420px; background: #fff; box-shadow: -8px 0 24px rgba(0,0,0,.18); padding: 16px 18px; overflow-y: auto; z-index: 20; display: none; }
    #ficha h2 { margin: 0 0 4px; font-size: 19px; padding-right: 30px; }
    #ficha h3 { margin: 18px 0 6px; font-size: 12px; text-transform: uppercase; letter-spacing: .06em; color: #6b7280; }
    #ficha .cerrar { position: absolute; top: 10px; right: 14px; font-size: 22px; cursor: pointer; color: #6b7280; }
    #ficha .sub { color: #4b5563; font-size: 13px; }
    #ficha .doc { white-space: pre-wrap; background: #f9fafb; padding: 10px 12px; border-radius: 6px; border-left: 4px solid #d1d5db; font-size: 13px; line-height: 1.45; margin-top: 10px; }
    #ficha .lista div { padding: 3px 0; font-size: 13px; }
    #ficha .gris { color: #9ca3af; }
    .enlace { color: #1d4ed8; cursor: pointer; }
    .enlace:hover { text-decoration: underline; }
</style>

rimero picking y\nluego almacenamiento, para arrancar con los huecos de picking servidos, pero cada\nproducto ocupa como mucho el máximo de ubicaciones de picking de Configurar, para que\npicking no se llene de palés de unos pocos; en \"Ubicar seleccionadas\", almacenamiento y\nluego picking, como cualquier entrada.\n\nSe lanza con Run y el resultado se enseña con MostrarResultado. La simulación hace la carga\nde verdad y al final la deshace con un error marcado: así cada propuesta ve los huecos que\nhan ocupado las anteriores, y lo único que sobrevive es el resultado, que va en una tabla\ntemporal.","num":"51106","l":28,"e":[{"a":"codeunit:carga inicial sga::trigger:onrun","k":"tiene"}]},"table:clasificacion abc sga":{"t":"table","n":"Clasificacion ABC SGA","f":"Tables/ClasificacionABCSGA.Table.al","d":"Table Clasificacion ABC SGA (ID 51113).\nUna línea por producto y cálculo ABC: cuánto ha salido, en qué clase queda y cuántos de sus\npalés están en un hueco de esa misma clase. Lo genera Cod. \"Analisis ABC SGA\".","c":"Clasificación ABC SGA","num":"51113","l":10,"e":[]},"table:ubicacion sga::field:secuencia picking":{"t":"field","n":"Secuencia picking","o":"table:ubicacion sga","f":"Tables/UbicacionSGA.Table.al","g":"OnValidate","l":86,"e":[{"a":"table:ubicacion sga::proc:testvacia","k":"llama","x":[{"v":{"s":"@s"},"c":[]}]}],"p":[{"k":"llama","l":88,"i":1,"a":"table:ubicacion sga::proc:testvacia","x":{"v":{"s":"@s"},"c":[]}}]},"page:ubicar producto sga::proc:confirmarlineas":{"t":"proc","n":"ConfirmarLineas","o":"page:ubicar producto sga","f":"Pages/UbicarProductoSGA.Page.al","d":"Registra las líneas de la tabla (todas con prm_Linea = 0, o solo una) con ConfirmarReparto\nde \"Gestion Entradas SGA\". Lo que queda sin ubicar pasa a ser la cantidad, en unidad\nbase, para volver a proponerlo cuando haya sitio; la tabla se queda a la vista.","l":448,"e":[{"a":"codeunit:gestion entradas sga::proc:confirmarreparto","k":"llama","x":[{"v":{"1":"@0","0":"r"},"c":[]}]},{"a" n","n":"Posted Assembly Order SGA","f":"PageExtensions/PostedAssemblyOrderSGA.PageExt.al","d":"PageExtension Posted Assembly Order SGA (ID 51106) extends Page \"Posted Assembly Order\".\nAñade a la ficha del ensamblado registrado dónde están ahora los palés que lo formaron.","b":"Posted Assembly Order","num":"51106","l":9,"e":[{"a":"pageextension:posted assembly order sga::action:palessga","k":"tiene"}]},"codeunit:gestion mapa sga":{"t":"codeunit","n":"Gestion Mapa SGA","f":"Codeunits/GestionMapaSGA.Codeunit.al","d":"Codeunit Gestion Mapa SGA (ID 51102).\nConstrucción y renderizado del mapa visual de almacén sobre el Bin estándar.\n\nEl mapa deduce la topología del propio código de ubicación, con el formato\npasillo-estantería-altura que genera Cod. \"Gestion Ubicaciones SGA\" (101-15-03).\nLas ubicaciones cuyo código no sigue ese formato no se dibujan: el mapa es una vista de\npasillos ordenados, y un código libre no tiene posición en la rejilla.","num":"51102","l":12,"e":[]},"codeunit:lote bc ensamblado sga::proc:alvalidarproducto":{"t":"suscriptor","n":"AlValidarProducto","o":"codeunit:lote bc ensamblado sga","f":"Ensamblado/LoteBCEnsambladoSGA.Codeunit.al","ev":"Table Assembly Header - OnAfterValidateEvent (Item No.)","l":25,"e":[{"a":"codeunit:lote bc ensamblado sga::proc:sincronizar","k":"llama","x":[{"v":{"0":"@0"},"c":[]}]}],"p":[{"k":"llama","l":27,"i":1,"a":"codeunit:lote bc ensamblado sga::proc:sincronizar","x":{"v":{"0":"@0"},"c":[]}}]},"page:rol center almacen sga::action:generarubicaciones":{"t":"action","n":"Generar ubicaciones","o":"page:rol center almacen sga","f":"Pages/RolCenterAlmacenSGA.Page.al","l":19,"e":[{"a":"report:generar ubicaciones sga","k":"abre"}]},"table:clasificacion abc sga::proc:estiloclaseabc":{"t":"proc","n":"EstiloClaseABC","o":"table:clasificacion abc sga","f":"Tables/ClasificacionABCSGA.Table.al","d":"Estilo de la columna Clase: A en verde, B en ámbar y C apagada.","l":144,"e":[]},"page:preparar picking sga":{"t":"page","n":"Preparar Picking SGA","f":"Pages/PrepararPickingSGA.Page.al","d":"Page Preparar Picking SGA (ID 51121).\nPantalla del preparador: le dice a qué ubicación ir, qué producto y qué lote coger y en\nqué cantidad, y recoge lo que lee o teclea para confirmar la parada.\n\nLa pantalla la dibuja el control \"Picking PDA SGA\", pensado para un terminal de mano y que\nfunciona igual en el navegador. La página solo le manda la parada (Pintar) y atiende lo que\ndevuelve; la lógica es de Cod. \"Gestion Picking SGA\".\n\nEn la app móvil de BC sobre un terminal con escáner, las lecturas llegan por el control\nBarcodeScannerProviderAddIn. Se escanee o se teclee, la lectura es la ubicación de la que\nrecoge, de la etiqueta del hueco, y se comprueba al momento. Con una ubicación válida la\nparada se confirma sola. Un error de lectura se avisa en la pantalla, con pitido, sin ventana.\n\nLa confirmación es la que retira el stock de la ubicación y deja la huella en el diario\nde movimientos, con el documento origen y el usuario, para la trazabilidad inversa.\n\nTrabaja sobre las paradas pendientes de una orden, ordenadas por recorrido físico. Abierta\ndesde una orden, trabaja esa y se cierra al terminarla. Abierta sola (menú de la PDA,\n\"Siguiente orden\"), está \"en turno\": toma la orden que le toca (SiguienteOrdenPreparar) y, al\nterminarla, pasa a la siguiente sin cerrarse.","c":"Preparar picking SGA","num":"51121","pt":"Card","l":28,"e":[{"a":"page:preparar picking sga::trigger:onopenpage","k":"tiene"},{"a":"page:preparar picking sga::trigger:onaftergetrecord","k":"tiene"},{"a":"page:preparar picking sga::usercontrol:pantalla","k":"tiene"},{"a":"page:preparar picking sga::usercontrol:escaner","k":"tiene"},{"a":"table:linea orden picking sga","k":"tabla"}]},"report:generar ubicaciones sga::trigger:requestpage.onopenpage":{"t":"trigger","n":"RequestPage - OnOpenPage","o":"report:generar ubicaciones sga","f":"Reports/GenerarUbicacionesSGA.Report.al","l":172,"e":[{"a":"table:config. sga ","f":"Pages/UbicarPaletsLineaSGA.Page.al","d":"Page Ubicar Palets Linea SGA (ID 51127).\nVersión de \"Impresión Etiquetas Producción\" (Pag50250) para trabajar con SGA: cada vez que\nse imprime la etiqueta de un palé, ese palé queda ubicado en el hueco que se propone (o en\nel que diga el operario). Imprimir y ubicar es un solo paso, para que no haya palés con\netiqueta y sin ubicación.\n\nLa página captura la tarea y la ubicación y enseña la situación del palé. El trabajo lo\nhace \"Gestion Entradas SGA\": PrepararPaleTarea calcula el siguiente palé y su hueco, y\nImprimirYUbicarPale saca la etiqueta y lo ubica. El palé se apunta al pedido de ensamblado\nenlazado a la tarea, así que al registrar el ensamblado \"Ubicar entradas\" ya lo da por\ncolocado.\n\nEn producción la etiqueta se genera igual que en Pag50250: mismo fichero para BarTender, misma\nruta y mismo contador de etiquetas impresas en la tarea. En Sandbox no se toca BarTender: sale\nla etiqueta A5 (report 50237) directa a impresora por Universal Print.","c":"Imprimir y ubicar palés de producción SGA","num":"51127","pt":"Worksheet","l":23,"e":[{"a":"page:ubicar palets linea sga::trigger:onopenpage","k":"tiene"},{"a":"page:ubicar palets linea sga::trigger:onclosepage","k":"tiene"},{"a":"page:ubicar palets linea sga::trigger:onaftergetcurrrecord","k":"tiene"},{"a":"page:ubicar palets linea sga::action:imprimiryubicar","k":"tiene"},{"a":"page:ubicar palets linea sga::action:proponerubicacion","k":"tiene"},{"a":"page:ubicar palets linea sga::action:otraubicacion","k":"tiene"},{"a":"page:ubicar palets linea sga::action:vercontenido","k":"tiene"},{"a":"page:ubicar palets linea sga::action:actualizarunitario","k":"tiene"},{"a":"page:ubicar palets linea sga::action:ajusta","k":"tiene"},{"a":"page:ubicar palets linea sga::field:ubicacion","k":"tiene"},{"a":"bc:table:tareas produccion","k":"tabla"}]},"page:contenido ubicaciones sga::trigger:onopenpage":{"t":"trigger","n":"OnOpenPage","o":"page:contenido ubicacione a entrada que aún no se\nha ubicado),\no = % de ocupación, redondeado hacia abajo (-1 si no se puede medir),\nm = por qué no se puede medir (solo si no se puede),\nl = líneas de contenido y, solo si tiene, k, pp, gi, fc y r (ver LeerContenidos);\nch = clase del hueco por su posición (1 A, 2 B, 3 C, 0 si no es hueco útil),\nf = 1 si es fondo de pasillo (solo si lo es).\nLas dos clases son del cálculo ABC prm_NoCalculoABC (0 = el último del almacén).\nLas claves son cortas porque el JSON viaja entero al navegador y un almacén grande\nson más de mil ubicaciones. Con prm_Pasillo distinto de 0, solo las de ese pasillo.\nEn prm_Resumen, el de ResumenUbicaciones del almacén y la zona: sin pasillo se cuenta con\nlas mismas ubicaciones que se leen; con pasillo se pide aparte.\n\nEl % se redondea hacia abajo para que no diga 100 % de una ubicación que aún tiene\nhueco. No se puede medir sin capacidad declarada, ni si algún producto de dentro no tiene\npalé en su ficha: su contenido se contaría en unidades base como si cada una fuera un palé.","l":125,"e":[{"a":"codeunit:gestion ubicaciones sga::proc:conceros","k":"llama","x":[{"v":{"0":"@2"},"c":["0|l"]}]},{"a":"codeunit:gestion ubicaciones sga::proc:resumenubicaciones","k":"llama","x":[{"v":{"1":"@1","0":"@0"},"c":["0|l"]}]},{"a":"table:ubicacion sga","k":"lee","x":[{"v":{},"c":["0|l"]}]},{"a":"codeunit:gestion ubicaciones sga::proc:textoresumen","k":"llama","x":[{"v":{},"c":["0|l"]}]},{"a":"codeunit:gestion ubicaciones sga::proc:trocearcodigo","k":"llama","x":[{"v":{},"c":["0|l"]}]},{"a":"codeunit:gestion mapa sga::proc:leerclasesabc","k":"llama","x":[{"v":{"1":"@3","0":"@0"},"c":["0|l"]}]},{"a":"codeunit:gestion mapa sga::proc:leercontenidos","k":"llama","x":[{"v":{"1":"@1","0":"@0"},"c":["0|l"]}]},{"a":"codeunit:gestion mapa sga::proc:estadonumerico","k":"llama","x":[{"v":{"0":"r"},"c":["0|l"]}]}],"p":[{"k":"llama","l":155,"i":7,"a":"codeunit:gestion ubicaciones sga::proc:conceros","x":{"v":{"0":"@2"},"c":["0|l"]}},{"k":" n":"Ubicar Entradas SGA","f":"Pages/UbicarEntradasSGA.Page.al","d":"Page Ubicar Entradas SGA (ID 51123).\nLo que ha entrado en el almacén en un día, con el hueco que le toca a cada cosa. Sirve para\nlos ensamblados y para las recepciones de compra: el operario ve la lista, el sistema le\npropone una ubicación para cada línea, y él confirma o pide otra.\n\nEl origen lo fija quien abre la página con un filtro de Origen (los menús, con\nRunPageView = where(Origen = const(Compra)) o const(Produccion)) o con Preparar. Sin nada,\nse abre en ensamblados.\n\nLas filas son líneas de \"Linea Ubicacion SGA\" con Origen Compra o Produccion, ordenadas por\ndocumento. La lista se reconstruye cada vez que se cambia un filtro: lo que ya está colocado\nse sabe por el diario de movimientos, no por una marca guardada aparte.","c":"Ubicar entradas SGA","num":"51123","pt":"Worksheet","l":21,"e":[{"a":"page:ubicar entradas sga::trigger:onclosepage","k":"tiene"},{"a":"page:ubicar entradas sga::trigger:onopenpage","k":"tiene"},{"a":"page:ubicar entradas sga::trigger:onaftergetrecord","k":"tiene"},{"a":"page:ubicar entradas sga::action:proponertodas","k":"tiene"},{"a":"page:ubicar entradas sga::action:otraubicacion","k":"tiene"},{"a":"page:ubicar entradas sga::action:confirmarlinea","k":"tiene"},{"a":"page:ubicar entradas sga::action:confirmartodo","k":"tiene"},{"a":"page:ubicar entradas sga::action:actualizarlista","k":"tiene"},{"a":"page:ubicar entradas sga::action:vercontenido","k":"tiene"},{"a":"page:ubicar entradas sga::action:vermovimientos","k":"tiene"},{"a":"page:ubicar entradas sga::field:filtrofechadesde","k":"tiene"},{"a":"page:ubicar entradas sga::field:filtrofechahasta","k":"tiene"},{"a":"page:ubicar entradas sga::field:filtroclase","k":"tiene"},{"a":"page:ubicar entradas sga::field:filtroproducto","k":"tiene"},{"a":"page:ubicar entradas sga::field:filtroalmacen","k":"tiene"},{"a":"page:ubicar entradas sga::field:solopendientes","k":"tiene"},{"a":"table:linea ubicacion sga","k" Ubicaciones SGA\".ProponerEnPicking, estrategia Estándar): la ubicación fija del\nproducto, si no consolidar y si no la primera libre, con su capacidad, mezcla y bloqueo.\n\nLa reubicación es una parada de una orden de origen Reposicion (Cod. \"Gestion Picking SGA\".\nAnadirReubicacion): reserva el stock de origen, se asigna, se prepara y se confirma como\ncualquier picking, y al confirmarla se traslada el stock al destino.","num":"51113","l":23,"e":[{"a":"codeunit:reposiciones sga::trigger:onrun","k":"tiene"}]},"table:ubicacion sga::proc:cabeentrada":{"t":"proc","n":"CabeEntrada","o":"table:ubicacion sga","f":"Tables/UbicacionSGA.Table.al","d":"Si caben prm_Entrada palés más (EnPales) en una ubicación con capacidad declarada, sin\npasar de ella. Es la comprobación de la propuesta (MotivoRechazoEntrada), que mira\nmuchos huecos seguidos: parte del estado y del \"% Ocupacion\" guardados, que deja al día\ncada movimiento (RecalcularOcupacion), y solo suma el contenido línea a línea cuando el\nresultado cae tan cerca de la capacidad que el redondeo del % podría cambiarlo.","l":528,"e":[{"a":"table:ubicacion sga::proc:ocupadoenpales","k":"llama","x":[{"v":{"s":"@s"},"c":[]}]}],"p":[{"k":"llama","l":546,"i":9,"a":"table:ubicacion sga::proc:ocupadoenpales","x":{"v":{"s":"@s"},"c":[]}}]},"page:movs. ubicacion sga":{"t":"page","n":"Movs. Ubicacion SGA","f":"Pages/MovsUbicacionSGA.Page.al","d":"Page Movs. Ubicacion SGA (ID 51104).\nDiario de movimientos de ubicación: quién movió qué, cuándo, desde dónde y a dónde.","c":"Movimientos de ubicación SGA","num":"51104","pt":"List","l":7,"e":[{"a":"table:movimiento ubicacion sga","k":"tabla"}]},"codeunit:gestion ubicaciones sga::proc:explicarsinhuecolote":{"t":"proc","n":"ExplicarSinHuecoLote","o":"codeunit:gestion ubicaciones sga","f":"Codeunits/GestionUbicacionesSGA.Codeunit.al","d":"Explica por qué no se ha podido proponer ningún hueco y qué hacer. La primera frase es\nsiempre la causa:\n- no hay ninguna ubicación de almacenamie ge.al","l":114,"e":[{"a":"page:analisis abc sga::proc:fijarcalculo","k":"llama"},{"a":"page:analisis abc sga","k":"abre"}],"p":[{"k":"llama","l":118,"i":1,"a":"page:analisis abc sga::proc:fijarcalculo"},{"k":"abre","l":119,"i":2,"a":"page:analisis abc sga"}]},"codeunit:analisis abc sga":{"t":"codeunit","n":"Analisis ABC SGA","f":"Codeunits/AnalisisABCSGA.Codeunit.al","d":"Codeunit Analisis ABC SGA (ID 51107).\nClasifica los productos por rotación (A, B, C) y los huecos por calidad, y guarda el\nresultado en \"Calculo ABC SGA\" / \"Clasificacion ABC SGA\". Solo observa: no mueve nada ni\ncambia cómo se ubica. Sirve para decidir con datos si merece la pena ubicar por rotación\n(ver SGA/Otros/DOCUMENTACION_TECNICA_SGA.md, parte II).\n\nProductos: los que han tenido ventas en los últimos \"Dias Analisis ABC\" días o tienen palés\nen SGA. La rotación se mide en palés salidos (ventas netas en UM base entre lo que lleva el\npalé del producto), porque con palés completos cada palé es un viaje de carretilla. De más a\nmenos salidas, son A hasta sumar \"Corte ABC Clase A\" % de los palés, B hasta \"Corte ABC\nClase B\" % y el resto C. Sin ventas, C.\n\nHuecos: los de Picking y Almacenamiento no bloqueados, del mejor al peor: primero por altura (el\nnivel más bajo es el mejor) y luego por \"Secuencia picking\". Se reparten en clases según los\npalés que hay de cada clase de producto: los primeros tantos huecos como palés A hay son A,\nlos siguientes tantos como palés B son B, y el resto C. Así cada clase tiene justo el sitio\nque necesita hoy.\n\nSe puede lanzar desde la cola de proyectos: calcula el almacén por defecto de la configuración.","num":"51107","l":26,"e":[{"a":"codeunit:analisis abc sga::trigger:onrun","k":"tiene"}]},"table:buffer conciliacion sga::proc:filtrarusuarioactual":{"t":"proc","n":"FiltrarUsuarioActual","o":"table:buffer conciliacion sga","f":"Tables/BufferConciliacionSGA.Table.al","d":"Deja solo las filas del usuario actual. No quita otros filtros ni cam icación.\n- Desvíos: recogidas de una ubicación distinta de la propuesta.","c":"Líneas de picking SGA","num":"51134","pt":"List","l":14,"e":[{"a":"page:lineas picking sga::trigger:onaftergetcurrrecord","k":"tiene"},{"a":"page:lineas picking sga::trigger:onaftergetrecord","k":"tiene"},{"a":"page:lineas picking sga::action:buscarotraubicacion","k":"tiene"},{"a":"page:lineas picking sga::action:verorden","k":"tiene"},{"a":"page:lineas picking sga::action:vercontenido","k":"tiene"},{"a":"table:linea orden picking sga","k":"tabla"}]},"codeunit:gestion entradas sga::proc:prepararpaletarea":{"t":"proc","n":"PrepararPaleTarea","o":"codeunit:gestion entradas sga","f":"Codeunits/GestionEntradasSGA.Codeunit.al","d":"Prepara el palé que sale de una tarea de embotellado, para ubicarlo en cuanto se imprime\nsu etiqueta. Deja en prm_Fila una sola fila, ya con hueco propuesto.\n\nLa entrada se apunta al pedido de ensamblado enlazado a la tarea, con el nº del pedido:\ncuando se registre, \"Ubicar entradas\" suma lo ubicado con ese número y no lo pide otra\nvez. Si el pedido ya está registrado se sigue usando su nº de pedido, y lo que se haya\nubicado con el del registrado también cuenta.\n\nSi el palé es completo o no lo dice la tarea: cada etiqueta es un palé de \"Cod. Pale\nDefecto\" y la tarea planifica NumBotellas (en la unidad base). La etiqueta n es completa\nsi a lo planificado le queda al menos un palé después de las n-1 anteriores; si no, es el\núltimo palé, incompleto, con lo que queda. Tampoco se ubica nunca más de lo que falta\ndel ensamblado.\n\nEl palé completo se ubica en la unidad de palé. El incompleto se ubica entero, en cajas (la\nunidad de venta) si son cajas exactas y si no en unidades sueltas.\n\nSin hueco libre, la ubicación queda en blanco y prm_Aviso dice por qué no lo hay.\n\nDevuelve false, con el porqué en prm_Aviso, si no hay palé que ubicar (también si la tarea\nes anterior a \"Fecha Inicio SGA\": lo que sacó ya es stock de BC y lo coloca la carga\ninicial). Con true, en prm_Aviso puede venir un aviso que no impide ubicar.","l":742,"e":[{"a":"codeunit:consulta stock sga::proc:esproductosga","k":"llama"},{"a":"bc:table:assembly header","k":"lee"},{"a":"bc:table:posted assembly header","k":"lee"},{"a":"codeunit:unidades producto sga::proc:umbase","k":"llama"},{"a":"codeunit:unidades producto sga::proc:factorsiexiste","k":"llama"},{"a":"table:linea ubicacion sga::proc:pendiente","k":"llama","x":[{"v":{"s":"@1"},"c":[]}]},{"a":"codeunit:unidades producto sga::proc:repartir","k":"llama","x":[{"v":{"4":"k"},"c":[]}]},{"a":"codeunit:unidades producto sga::proc:desdebase","k":"llama"},{"a":"codeunit:gestion entradas sga::proc:liberarreservasfilas","k":"llama","x":[{"v":{"0":"k"},"c":[]}]},{"a":"codeunit:gestion entradas sga::proc:leerconfig","k":"llama"},{"a":"codeunit:gestion entradas sga::proc:lotesensamblado","k":"llama","x":[{"v":{"3":"v"},"c":[]},{"v":{"2":"v"},"c":[]}]},{"a":"codeunit:gestion entradas sga::proc:calcularpendiente","k":"llama","x":[{"v":{"0":"k"},"c":[]}]},{"a":"codeunit:gestion entradas sga::proc:proponerparatodos","k":"llama","x":[{"v":{"0":"k"},"c":[]}]}],"p":[{"k":"llama","l":764,"i":1,"a":"codeunit:gestion entradas sga::proc:liberarreservasfilas","x":{"v":{"0":"k"},"c":[]}},{"k":"llama","l":769,"i":5,"a":"codeunit:gestion entradas sga::proc:leerconfig"},{"k":"llama","l":774,"i":10,"a":"codeunit:consulta stock sga::proc:esproductosga"},{"k":"llama","l":790,"i":24,"a":"codeunit:gestion entradas sga::proc:lotesensamblado","x":{"v":{"3":"v"},"c":[]}},{"k":"llama","l":804,"i":38,"a":"codeunit:gestion entradas sga::proc:lotesensamblado","x":{"v":{"2":"v"},"c":[]}},{"k":"llama","l":821,"i":50,"a":"codeunit:unidades producto sga::proc:umbase"},{"k":"llama","l":832,"i":58,"a":"codeunit:unidades producto sga::proc:factorsiexiste"},{"k":"llama","l":838,"i":63,"a":"codeunit:gestion entradas sga::proc:calcularpendiente","x":{"v":{"0":"k"},"c":[]}},{"k":"llama","l":851,"i":74,"a":"table:linea ubicacion sga::pr fig. sga::action:recalcularubicaciones","k":"tiene"},{"a":"page:config. sga::action:cargainicial","k":"tiene"},{"a":"page:config. sga::action:verubicaciones","k":"tiene"},{"a":"page:config. sga::action:verzonas","k":"tiene"},{"a":"page:config. sga::field:repartoabc","k":"tiene"},{"a":"table:config. sga","k":"tabla"}]},"page:cue sga::field:ordenes envio vencido":{"t":"field","n":"Ordenes Envio Vencido","o":"page:cue sga","f":"Pages/CueSGA.Page.al","l":9,"e":[{"a":"page:ordenes picking sga","k":"abre"}]},"page:rol center almacen sga::action:mapa3d":{"t":"action","n":"Mapa 3D de almacén","o":"page:rol center almacen sga","f":"Pages/RolCenterAlmacenSGA.Page.al","l":19,"e":[{"a":"page:mapa 3d almacen sga","k":"abre"}]},"page:ubicaciones sga::action:liberarreserva":{"t":"action","n":"Liberar reserva","o":"page:ubicaciones sga","f":"Pages/UbicacionesSGA.Page.al","l":257,"e":[{"a":"bc:codeunit:confirm management","k":"llama","m":"GetResponseOrDefault"},{"a":"codeunit:gestion ubicaciones sga::proc:liberarreservasseleccion","k":"llama","x":[{"v":{"0":"r"},"c":[]}]}],"p":[{"k":"llama","l":265,"i":1,"a":"bc:codeunit:confirm management"},{"k":"aviso","l":265,"i":1,"s":"qst","t":"Se quitará la reserva de las ubicaciones seleccionadas. Si alguien está ubicando en ellas, se le podrán proponer a otro.\\¿Desea continuar?"},{"k":"aviso","l":269,"i":4,"s":"msg","t":"Se ha quitado la reserva de «número de ubicaciones» ubicaciones."},{"k":"llama","l":269,"i":4,"a":"codeunit:gestion ubicaciones sga::proc:liberarreservasseleccion","x":{"v":{"0":"r"},"c":[]}}]},"codeunit:gestion mapa sga::proc:leercontenidos":{"t":"proc","n":"LeerContenidos","o":"codeunit:gestion mapa sga","f":"Codeunits/GestionMapaSGA.Codeunit.al","d":"Lo que hay en las ubicaciones del mapa (almacén, zona y pasillo de DatosMapa3D), leído en\nuna sola consulta: el contenido se recorre por su clave principal, que empieza por\nalmacén y ubicación, así que las líneas de cada ubicación vienen seguidas. La descripción\ndel producto llega en la misma consulta (FlowField Descripcion).\n\nPor cada ubicación con contenido deja en prm_Contenidos el principio de su elemento:\nl = líneas, k = las primeras líneas (ver LineaMapa) y, de todas ellas, pp = productos\n(sin repetir, para buscar), gi = Grupos IIEE de sus productos (sin repetir, los que\ntienen), fc = caducidad más próxima (aaaa-mm-dd, vacía si ninguna lleva) y r = mejor\nclase ABC de sus productos según prm_ClasesABC (1 A, 2 B, 3 C, 0 sin clase).\nY en prm_SinPale, si algún producto de dentro no tiene palé en su ficha, por qué no se\npuede medir en palés (el primero que falla).\n\nVa con el resto del mapa y no se pide al pasar el ratón: una ida y vuelta a BC por cada\nbloque haría la ficha lenta. Se envían solo las primeras líneas para que un hueco mixto\ncon muchas referencias no engorde el JSON; el lienzo dice cuántas faltan con \"l\".","l":248,"e":[{"a":"table:contenido ubicacion sga","k":"lee"},{"a":"codeunit:unidades producto sga::proc:leerpale","k":"llama"},{"a":"codeunit:gestion mapa sga::proc:lineamapa","k":"llama","x":[{"v":{"0":"r"},"c":[]}]}],"p":[{"k":"llama","l":285,"i":17,"a":"codeunit:gestion mapa sga::proc:lineamapa","x":{"v":{"0":"r"},"c":[]}},{"k":"llama","l":295,"i":25,"a":"codeunit:unidades producto sga::proc:leerpale"}]},"report:carga inicial contenido sga::field:ubicacionindicada":{"t":"field","n":"Ubicación indicada","o":"report:carga inicial contenido sga","f":"Reports/CargaInicialContenidoSGA.Report.al","g":"OnLookup, OnValidate","l":71,"e":[{"a":"codeunit:gestion ubicaciones sga::proc:comprobarubicacionexiste","k":"llama"}],"p":[{"k":"llama","l":87,"i":8,"a":"codeunit:gestion ubicaciones sga::proc:comprobarubicacionexiste"}],"sg":[{"n":"OnLookup","d":0},{"n":"OnValidate","d":7}],"rm":[]},"codeunit:gestion picking sga::proc:cambiarplaya":{"t":"proc","n":"CambiarPlaya","o":"codeunit:gestion picking sga","f":"Codeunits/GestionPickingSGA.Codeunit.al","d":"Pide una playa del almacén de la primera orden del conjunto recibido y la pone en las\nórdenes de venta de ese almacén que aún no se han empezado. Las demás se quedan como\nestán y el mensaje dice cuántas.","l":1222,"e":[{"a":"table:orden picking sga","k":"lee","x":[{"v":{},"c":["0|r"]}]},{"a":"table:zona sga","k":"lee"},{"a":"table:orden picking sga::proc:filtrarsinempezar","k":"llama","x":[{"v":{"s":"@0"},"c":[]}]},{"a":"table:orden picking sga","k":"escribe","x":[{"v":{},"c":["0|r"]}]}],"p":[{"k":"aviso","l":1239,"i":7,"s":"err","t":"El almacén «almacén» no tiene ninguna zona marcada como playa."},{"k":"llama","l":1245,"i":12,"a":"table:orden picking sga::proc:filtrarsinempezar","x":{"v":{"s":"@0"},"c":[]}},{"k":"escribe","l":1249,"i":16,"a":"table:orden picking sga","op":"modify","x":{"v":{},"c":["0|r"]}},{"k":"aviso","l":1253,"i":19,"s":"msg","t":"Playa «playa» puesta en «número de órdenes» órdenes."},{"k":"aviso","l":1255,"i":21,"s":"msg","t":"«número de órdenes» órdenes no se han cambiado: ya están empezadas, terminadas o canceladas, o no son de venta del almacén «almacén»."}]},"bc:codeunit:unit of measure management":{"t":"bc-codeunit","n":"Unit of Measure Management","e":[]},"table:contenido ubicacion sga":{"t":"table","n":"Contenido Ubicacion SGA","f":"Tables/ContenidoUbicacionSGA.Table.al","d":"Table Contenido Ubicacion SGA (ID 51102).\nEstado actual del almacén: qué producto, lote y unidad de medida hay\nahora mismo en cada ubicación, de qué palé (SSCC) y en qué cantidad. Dos palés del mismo\nlote en un hueco son dos líneas.\n\nEs una capa de detalle sobre el stock de BC, no un stock paralelo: la cantidad total\nla siguen gobernando los movimientos de producto. Un traslado entre ubicaciones\nmueve filas de esta tabla y NO genera movimiento de producto.\n\nSolo escribe en ella Cod. \"Gestion Contenido SGA\". Los triggers lo imponen para que\nel estado de ocupación y el diario de movimientos no puedan quedar descuadrados.","c":"Contenido ubicación SGA","num":"51102","l":19,"e":[{"a":"table:contenido ubicacion sga::trigger:oninsert","k":"tiene"},{"a":"table:contenido ubicacion sga::trigger:onmodify","k":"tiene"},{"a":"table:contenido ubicacion sga::trigger:ondelete","k":"tiene"},{"a":"table:contenido ubicacion sga::trigger:onrename","k":"tiene"}]},"report:generar ubicaciones sga::field:alturadesde":{"t":"field","n":"Altura desde","o":"report:generar ubicaciones sga","f":"Reports/GenerarUbicacionesSGA.Report.al","g":"OnValidate","l":133,"e":[{"a":"report:generar ubicaciones sga::proc:leeraltura","k":"llama"}],"p":[{"k":"llama","l":135,"i":1,"a":"report:generar ubicaciones sga::proc:leeraltura"}]},"page:ubicar palets linea sga::proc:imprimiryubicarpale":{"t":"proc","n":"ImprimirYUbicarPale","o":"page:ubicar palets linea sga","f":"Pages/UbicarPaletsLineaSGA.Page.al","d":"Imprime la etiqueta del palé y lo ubica, con Cod. \"Gestion Entradas SGA\". Todo lo que\npuede impedir ubicarlo se comprueba antes de imprimir, para no dejar etiquetas de palés\nsin ubicación: aquí, que haya palé; en el codeunit, la ubicación y la etiqueta.","l":437,"e":[{"a":"codeunit:gestion entradas sga::proc:imprimiryubicarpale","k":"llama","x":[{"v":{"1":"k"},"c":[]}]},{"a":"bc:table:tareas produccion","k":"lee"},{"a":"page:ubicar palets linea sga::proc:cargarpale","k":"llama"}],"p":[{"k":"llama","l":445,"i":2,"a":"page:ubicar palets linea sga::proc:cargarpale"},{"k":"llama","l":452,"i":7,"a":"codeunit:gestion entradas sga::proc:imprimiryubicarpale","x":{"v":{"1":"k"},"c":[]}},{"k":"llama","l":456,"i":10,"a":"page:ubicar palets linea sga::proc:cargarpale"}]},"codeunit:gestion ubicaciones sga::proc:codigoubicacionvalido":{"t":"proc","n":"CodigoUbicacionValido","o":"codeunit:gestion ubicaciones sga","f":"Codeunits/GestionUbicacionesSGA.Codeunit.al","d":"La regla de ComprobarCodigoUbicacion sin dar error, para quien avisa de otra forma (la\nPDA): devuelve si el código tiene el formato y, si no, en prm_Motivo el texto del aviso.","l":439,"e":[{"a":"codeunit:gestion ubicaciones sga::proc:trocearcodigo","k":"llama","x":[{"v":{"0":"@0"},"c":[]}]}],"p":[{"k":"llama","l":447,"i":2,"a":"codeunit:gestion ubicaciones sga::proc:trocearcodigo","x":{"v":{"0":"@0"},"c":[]}},{"k":"aviso","l":450,"i":5,"s":"err","t":"El código «código tecleado» no es válido. Tiene que ser pasillo-estantería-altura: pasillo de 001 a 999, estantería de 01 a 99 y altura de 00 a 99 (por ejemplo 101-15-10)."}]},"codeunit:gestion picking sga":{"t":"codeunit","n":"Gestion Picking SGA","f":"Codeunits/GestionPickingSGA.Codeunit.al","d":"Codeunit Gestion Picking SGA (ID 51104).\nMotor de picking: convierte un pedido de venta en un recorrido de paradas, reserva en las\nubicaciones lo que cada parada va a coger, registra la retirada cuando el preparador\nconfirma y, al terminar, pasa al pedido lo recogido (cantidad a enviar y lotes).\n\nLas órdenes sirven también para las reubicaciones de almacenamiento a picking (origen\nReposicion, AnadirReubicacion): la parada lleva una ubicación destino y, al confirmarla, lo\nrecogido se traslada allí en vez de salir. Qué reubicar lo decide Cod. \"Reposiciones SGA\".\n\nLas paradas guardan las cantidades en unidad de medida base, igual que el resto del módulo.\nLa UM de la línea del pedido viaja en la parada solo para enseñársela al preparador.\n\nLa reserva no se suma ni se resta sobre la marcha: se recalcula desde las paradas abiertas\nde cada hueco (RecalcularReserva). Así no hay forma de que se quede descuadrada si una\nparada se cancela, se recoge de otro hueco o la orden se cancela entera.\n\nEl movimiento lo escribe Cod. \"Gestion Contenido SGA\": este codeunit decide de dónde\ncoger, pero no toca las tablas de contenido ni el diario.\n\nOnRun pasa una orden al pedido. Existe para poder llamarlo con Codeunit.Run al terminar\nel recorrido: si el pedido no acepta los datos, el preparador no pierde lo confirmado.","num":"51104","l":35,"e":[{"a":"codeunit:gestion picking sga::trigger:onrun","k":"tiene"}]},"codeunit:gestion entradas sga":{"t":"codeunit","n":"Gestion Entradas SGA","f":"Codeunits/GestionEntradasSGA.Codeunit.al","d":"Codeunit Gestion Entradas SGA (ID 51105).\nLleva lo que entra en el almacén hasta su hueco: reúne lo que ha entrado en una fecha\n(ensamblados registrados o recepciones de compra), propone dónde dejar cada cosa y registra\nla entrada cuando el operario confirma.\n\nNo se engancha al registro de BC a propósito: las validaciones de SGA (capacidad, mezcla,\nbloqueo) lanzan error, y dentro del registro harían fallar el albarán. BC registra como\nsiempre y SGA va detrás, leyendo lo registrado.\n\nLo que ya está colocado no se guarda en ninguna marca propia: se deduce del diario de\nmovimientos, que es la verdad del módulo. Así la pantalla se puede cerrar y volver a abrir\nsin perder el hilo y sin arrastrar un estado paralelo que se desincronice.\n\nQuien escribe sigue siendo Cod. \"Gestion Contenido SGA\": aquí solo se decide.\n\nTambién es dueño del palé de una tarea de producción (\"Imprimir y ubicar palés\"): prepara\nel siguiente palé con su hueco (PrepararPaleTarea), saca su etiqueta (BarTender o, en\nSandbox, el report A5), anota la etiqueta en la tarea y lo ubica (ImprimirYUbicarPale).\n\nTodo palé entra con su SSCC: el leído de su etiqueta o, si no la trae, uno nuevo. Por eso\nlas entradas se ubican de palé en palé.","num":"51105","l":38,"e":[]},"raiz:bc":{"t":"raiz","n":"raiz:bc","e":[{"a":"pageextension:location card sga","k":"tiene"},{"a":"pageextension:sales order subform sga","k":"tiene"},{"a":"pageextension:user setup sga","k":"tiene"},{"a":"pageextension:item card sga","k":"tiene"},{"a":"pageextension:order processor sga","k":"tiene"},{"a":"pageextension:posted assembly order sga","k":"tiene"},{"a":"pageextension:sales order list sga","k":"tiene"},{"a":"pageextension:sales order sga","k":"tiene"},{"a":"pageextension:item list sga","k":"tiene"},{"a":"pageextension:posted assembly orders sga","k":"tiene"}]},"table:linea orden picking sga::proc:enumdocumento":{"t":"proc","n":"EnUMDocumento","o":"table:li e:asignar ordenes picking sga::proc:asignarseleccion":{"t":"proc","n":"AsignarSeleccion","o":"page:asignar ordenes picking sga","f":"Pages/AsignarOrdenesPickingSGA.Page.al","d":"Asigna las órdenes seleccionadas, o, con prm_Usuario en blanco, quita la asignación de\nlas que no se han empezado (AsignarOrdenes).","l":288,"e":[{"a":"table:orden picking sga","k":"lee"},{"a":"codeunit:gestion picking sga::proc:asignarordenes","k":"llama","x":[{"v":{"1":"@0","0":"r"},"c":[]}]}],"p":[{"k":"llama","l":300,"i":3,"a":"codeunit:gestion picking sga::proc:asignarordenes","x":{"v":{"1":"@0","0":"r"},"c":[]}},{"k":"aviso","l":305,"i":7,"s":"msg","t":"Se ha quitado la asignación de «número» órdenes.","x":{"v":{},"c":["0|v"]}},{"k":"aviso","l":305,"i":7,"s":"msg","t":"«número» órdenes ya empezadas siguen con su preparador.","x":{"v":{},"c":["0|v"]}},{"k":"aviso","l":307,"i":9,"s":"msg","t":"Se ha quitado la asignación de «número» órdenes.","x":{"v":{},"c":["0|v"]}},{"k":"aviso","l":309,"i":11,"s":"msg","t":"Se han asignado «número» órdenes a «usuario».","x":{"v":{},"c":["0|l"]}}]},"codeunit:gestion picking sga::proc:terminarrecorrido":{"t":"proc","n":"TerminarRecorrido","o":"codeunit:gestion picking sga","f":"Codeunits/GestionPickingSGA.Codeunit.al","d":"El preparador ha recorrido la orden (Preparar Picking SGA): guarda lo confirmado y pasa lo\nrecogido al pedido. Se guarda antes (Commit): si el pedido no acepta los datos, el\npreparador no pierde su trabajo y oficina lo repite desde la orden con \"Pasar al pedido\";\nentonces prm_Fallo vuelve a true. Si quedan paradas retenidas, la orden sigue en proceso\npara el jefe de almacén, pero lo recogido ya pasa al pedido: el paso se puede repetir sin\nduplicar cuando se resuelvan. Devuelve el texto para el preparador: terminada o con\nretenidas, la playa donde dejarla y si está en el pedido.","l":1510,"e":[{"a":"codeunit:gestion picking sga","k":"ejecuta"},{"a":"table:orden picking sga","k":"lee"}],"p":[{"k":"aviso","l":1521,"i":3,"s":"msg <script>
(function () {
    'use strict';

    var N = DATOS.nodos;
    var SVGNS = 'http://www.w3.org/2000/svg';
    var lienzo = document.getElementById('lienzo');
    var ayuda = document.getElementById('ayuda');
    var ficha = document.getElementById('ficha');

    var COLOR = { menu: '#374151', page: '#2563eb', report: '#db2777', codeunit: '#15803d', table: '#b45309', bc: '#9ca3af', accion: '#0891b2' };
    var COLOR_ARISTA = { lee: '#d97706', escribe: '#dc2626', abre: '#2563eb', llama: '#16a34a', usa: '#64748b' };
    var CLASE = {
        proc: 'Función', trigger: 'Trigger', action: 'Botón (acción)', field: 'Campo', usercontrol: 'Control de la pantalla',
        suscriptor: 'Reacción a un evento de BC', page: 'Pantalla', report: 'Informe', codeunit: 'Codeunit (lógica)',
        table: 'Tabla', tableextension: 'Ampliación de tabla', pageextension: 'Ampliación de pantalla de BC',
        menu: 'Menú', profile: 'Perfil'
    };

    // ---- Utilidades -------------------------------------------------------------------------

    function el(etiqueta, clase, texto) {
        var e = document.createElement(etiqueta);
        if (clase) { e.className = clase; }
        if (texto !== undefined && texto !== null) { e.textContent = texto; }
        return e;
    }
    function svg(etiqueta, atributos, padre) {
        var e = document.createElementNS(SVGNS, etiqueta);
        Object.keys(atributos || {}).forEach(function (k) { e.setAttribute(k, atributos[k]); });
        if (padre) { padre.appendChild(e); }
        return e;
    }
    function tipo(id) { return N[id] ? N[id].t : ''; }
    function esBC(id) { return tipo(id).indexOf('bc-') === 0; }
    function objDe(id) { return N[id].o || id; }
    function esPagina(id) { var t = tipo(id); return t === 'page' || t === 'report'; }
    function esParte(id) { var pt = N[id].pt; return pt === 'CardPart' || pt === 'ListPart' || pt === 'RoleCenter'; }
    function esLogica(id) { var o = N[id] && N[id].o; var t = tipo(o); return !!o && (t === 'codeunit' || t === 'table' || t === 'tableextension'); }

    function nombre(id) {
        var n = N[id];
        if (TEXTOS[n.n]) { return TEXTOS[n.n]; }
        if (n.t === 'suscriptor' && n.ev) { return n.ev; }
        if (n.t === 'trigger' && TRIGGERS[n.n.toLowerCase()]) { return TRIGGERS[n.n.toLowerCase()]; }
        if (n.c && !n.o) { return n.c; }
        return n.n;
    }
    // Lo que se lee en una fila: el campo dice además qué lo dispara.
    function textoFila(id) {
        var n = N[id];
        var t = nombre(id);
        if (n.t === 'field' && n.g) { t += ' (' + n.g.split(', ').map(function (g) { return TRIGGERS[g.toLowerCase()] || g; }).join(', ') + ')'; }
        if (n.t === 'usercontrol') { t = 'Control ' + t + (n.g ? ' (eventos: ' + n.g + ')' : ''); }
        return t;
    }
    function colorObjeto(id) {
        if (esBC(id)) { return COLOR.bc; }
        var t = tipo(id);
        if (t === 'tableextension') { return COLOR.table; }
        return COLOR[t] || '#6b7280';
    }
    function recortar(texto, ancho, tamano) {
        var max = Math.floor(ancho / (tamano * 0.56));
        return texto.length > max ? texto.substring(0, max - 1) + '…' : texto;
    }

    var miembrosDe = {};
    var entran = {};
    Object.keys(N).forEach(function (id) {
        var o = N[id].o;
        if (o) { (miembrosDe[o] = miembrosDe[o] || []).push(id); }
        N[id].e.forEach(function (a) { if (N[a.a]) { (entran[a.a] = entran[a.a] || []).push({ de: id, k: a.k, m: a.m }); } });
    });
    Object.keys(miembrosDe).forEach(function (o) { miembrosDe[o].sort(function (a, b) { return (N[a].l || 0) - (N[b].l || 0); }); });

    function partesDe(id) {
        return N[id].e.filter(function (a) { return a.k === 'contiene' && tipo(a.a) === 'page' && !esBC(a.a); }).map(function (a) { return a.a; });
    }
    function propiosDe(id) {
        var p = {};
        p[id] = true;
        if (esPagina(id)) { partesDe(id).forEach(function (x) { p[x] = true; }); }
        return p;
    }

    function onRun(cu) {
        var r = (miembrosDe[cu] || []).filter(function (m) { return N[m].t === 'trigger' && N[m].n.toLowerCase() === 'onrun'; });
        return r.length ? r[0] : null;
    }

    // Qué alcanza un grupo de miembros, a nivel de objeto: atraviesa las funciones propias (y
    // las de las tablas, que son parte de los datos) y se para en codeunits, pantallas y tablas.
    function salidas(inicios, propios) {
        var res = { cu: {}, tab: {}, pag: {} }, vistos = {}, pila = inicios.slice();
        while (pila.length) {
            var m = pila.pop();
            if (vistos[m]) { continue; }
            vistos[m] = true;
            N[m].e.forEach(function (a) {
                var d = a.a, td = tipo(d);
                if (!N[d]) { return; }
                if (a.k === 'lee' || a.k === 'escribe') {
                    if (td === 'table' || td === 'bc-table') { res.tab[d] = (res.tab[d] === 'escribe' || a.k === 'escribe') ? 'escribe' : 'lee'; }
                    return;
                }
                if (a.k === 'abre') { if (esPagina(d) && !propios[d]) { res.pag[d] = true; } return; }
                if (a.k === 'ejecuta') { if (td === 'codeunit') { res.cu[d] = true; } return; }
                if ((a.k !== 'llama' && a.k !== 'dispara') || esBC(d)) { return; }
                var od = objDe(d), tod = tipo(od);
                if (propios[od] || tod === 'table' || tod === 'tableextension') { pila.push(d); return; }
                if (tod === 'codeunit') { res.cu[od] = true; return; }
                if (esPagina(od)) { res.pag[od] = true; }
            });
        }
        return res;
    }

    // ---- Plano general ---------------------------------------------------------------------

    var plano = null;

    function construirPlano() {
        var grupos = [];
        function destinosFila(m, propios) {
            var directos = N[m].e.filter(function (a) { return a.k === 'abre' || a.k === 'ejecuta'; }).map(function (a) { return a.a; });
            if (directos.length) { return directos; }
            var s = salidas([m], propios);
            return Object.keys(s.pag).concat(Object.keys(s.cu));
        }
        N['raiz:perfiles'].e.forEach(function (a) {
            N[a.a].e.forEach(function (b) {
                N[b.a].e.forEach(function (c) {
                    if (tipo(c.a) !== 'menu') { return; }
                    var g = { id: c.a, titulo: nombre(c.a), sub: nombre(a.a), filas: [] };
                    N[c.a].e.forEach(function (d) { g.filas.push({ id: d.a, texto: nombre(d.a), destinos: destinosFila(d.a, propiosDe(b.a)) }); });
                    grupos.push(g);
                });
            });
        });
        // Una caja por pantalla de BC a la que SGA añade botones o campos.
        N['raiz:bc'].e.forEach(function (a) {
            var g = { id: a.a, titulo: N[a.a].b || nombre(a.a), sub: 'pantalla de BC · lo que añade SGA', filas: [] };
            N[a.a].e.forEach(function (b) {
                if (b.k !== 'tiene') { return; }
                g.filas.push({ id: b.a, texto: textoFila(b.a), destinos: destinosFila(b.a, propiosDe(a.a)) });
            });
            if (g.filas.length) { grupos.push(g); }
        });
        var ev = { id: 'raiz:eventos', titulo: 'Eventos de BC', sub: 'SGA reacciona cuando BC…', filas: [] };
        N['raiz:eventos'].e.forEach(function (a) { ev.filas.push({ id: a.a, texto: nombre(a.a), destinos: [objDe(a.a)] }); });
        if (ev.filas.length) { grupos.push(ev); }

        // Objetos de cada capa y lo que usa cada uno.
        var paginas = [], codeunits = [], tablas = {};
        Object.keys(N).forEach(function (id) {
            if (esPagina(id) && !esParte(id)) { paginas.push(id); }
            if (tipo(id) === 'codeunit') { codeunits.push(id); }
            if (tipo(id) === 'table' && !N[id].tmp) { tablas[id] = true; }
        });
        var usa = {};   // objeto -> [{a, k}]
        function anotar(o, s) {
            var l = [];
            Object.keys(s.cu).forEach(function (x) { if (x !== o) { l.push({ a: x, k: 'llama' }); } });
            Object.keys(s.tab).forEach(function (x) { l.push({ a: x, k: s.tab[x] }); tablas[x] = true; });
            Object.keys(s.pag).forEach(function (x) { if (x !== o && !esBC(x)) { l.push({ a: x, k: 'abre' }); } });
            usa[o] = l;
        }
        paginas.forEach(function (p) {
            var propios = propiosDe(p), ini = [];
            Object.keys(propios).forEach(function (o) { ini = ini.concat(miembrosDe[o] || []); });
            anotar(p, salidas(ini, propios));
        });
        codeunits.forEach(function (c) { anotar(c, salidas(miembrosDe[c] || [], propiosDe(c))); });

        // Orden de las pantallas: como salen en los menús; las que no, al final.
        var orden = {}, n = 0;
        grupos.forEach(function (g) { g.filas.forEach(function (f) { f.destinos.forEach(function (d) { if (orden[d] === undefined) { orden[d] = n++; } }); }); });
        paginas.sort(function (a, b) {
            var oa = orden[a] === undefined ? 9999 : orden[a], ob = orden[b] === undefined ? 9999 : orden[b];
            return oa - ob || nombre(a).localeCompare(nombre(b));
        });
        plano = { grupos: grupos, paginas: paginas, codeunits: codeunits, tablas: Object.keys(tablas), usa: usa };
    }

    // Coloca en vertical una columna: cada caja lo más cerca posible de su altura deseada.
    function colocar(ids, deseada, alto, hueco, inicio) {
        ids.sort(function (a, b) { return deseada(a) - deseada(b); });
        var y = {}, ultimo = inicio - hueco;
        ids.forEach(function (id) { var v = Math.max(deseada(id), ultimo + hueco); y[id] = v; ultimo = v + alto; });
        return y;
    }

    function pintarPlano(seleccion) {
        if (!plano) { construirPlano(); }
        vista = { tipo: 'plano' };
        migas([{ texto: 'Plano general' }]);
        ayudaPlano(null);

        var X = [20, 360, 690, 1000], W = [300, 280, 260, 240], ALTO = 30, HUECO = 8, ARRIBA = 50;
        var lienzoSvg = nuevoSvg();
        var capaAristas = svg('g', {}, lienzoSvg), capaCajas = svg('g', {}, lienzoSvg);
        ['MENÚS', 'PANTALLAS', 'LÓGICA (CODEUNITS)', 'TABLAS'].forEach(function (t, i) {
            svg('text', { x: X[i], y: 28, 'font-size': 12, 'font-weight': 700, fill: '#6b7280', 'letter-spacing': '1' }, capaCajas).textContent = t;
        });

        var pos = {};    // id -> {x, y, w, h}  (centro vertical en y + h/2)
        var y = ARRIBA;
        plano.grupos.forEach(function (g) {
            var alto = 40 + g.filas.length * 22 + 6;
            var caja = cajaGrupo(capaCajas, X[0], y, W[0], alto, g);
            pos[g.id] = { x: X[0], y: y, w: W[0], h: alto, el: caja };
            g.filas.forEach(function (f, i) { pos[f.id] = { x: X[0], y: y + 40 + i * 22, w: W[0], h: 22, fila: true }; });
            y += alto + 14;
        });
        var altoMenus = y;

        // Las pantallas, seguidas y en el orden de los menús.
        plano.paginas.forEach(function (p, i) { pos[p] = { x: X[1], y: ARRIBA + i * (ALTO + HUECO), w: W[1], h: ALTO }; });

        function media(destino, fuentes) {
            var suma = 0, cuenta = 0;
            fuentes.forEach(function (f) { (plano.usa[f] || []).forEach(function (u) { if (u.a === destino && pos[f]) { suma += pos[f].y; cuenta++; } }); });
            return cuenta ? suma / cuenta : 99999;
        }
        var filasMenu = [];
        plano.grupos.forEach(function (g) { g.filas.forEach(function (f) { filasMenu.push(f); }); });
        var yc = colocar(plano.codeunits.slice(), function (c) {
            var v = media(c, plano.paginas), s = 0, k = 0;
            filasMenu.forEach(function (f) { if (f.destinos.indexOf(c) >= 0) { s += pos[f.id].y; k++; } });
            if (k) { v = v === 99999 ? s / k : (v + s / k) / 2; }
            return v;
        }, ALTO, HUECO * 2, ARRIBA);
        plano.codeunits.forEach(function (c) { pos[c] = { x: X[2], y: yc[c], w: W[2], h: ALTO }; });
        var yt = colocar(plano.tablas.slice(), function (t) {
            var a = media(t, plano.codeunits), b = media(t, plano.paginas);
            if (a === 99999) { return b; }
            if (b === 99999) { return a; }
            return (a * 2 + b) / 3;
        }, ALTO, HUECO, ARRIBA);
        plano.tablas.forEach(function (t) { pos[t] = { x: X[3], y: yt[t], w: W[3], h: ALTO }; });

        // Cajas de pantallas, codeunits y tablas.
        plano.paginas.concat(plano.codeunits, plano.tablas).forEach(function (id) {
            var p = pos[id];
            p.el = cajaSimple(capaCajas, p.x, p.y, p.w, p.h, nombre(id), colorObjeto(id), id, tipo(id) === 'codeunit' || tipo(id) === 'table');
        });

        // Aristas: filas de menú -> objeto; pantalla -> codeunit/tabla; codeunit -> tabla/codeunit.
        var aristas = [];
        filasMenu.forEach(function (f) {
            f.destinos.forEach(function (d) { if (pos[d]) { aristas.push({ de: f.id, a: d, k: tipo(d) === 'codeunit' ? 'llama' : 'abre' }); } });
        });
        Object.keys(plano.usa).forEach(function (o) {
            plano.usa[o].forEach(function (u) { if (pos[o] && pos[u.a]) { aristas.push({ de: o, a: u.a, k: u.k }); } });
        });
        // Las de quién usa a quién directamente. Sin líneas hasta que se pulsa una caja: todas a
        // la vez no se pueden leer. Lo que alcanza la caja pulsada va en capaResalte.
        aristas.forEach(function (a) {
            a.el = trazo(capaAristas, pos[a.de], pos[a.a], a.k, 0.85, 1.8);
            a.el.classList.add('oculta');
        });
        plano.capaResalte = svg('g', {}, capaAristas);

        var alto = Math.max(altoMenus, ARRIBA + plano.paginas.length * (ALTO + HUECO));
        Object.keys(pos).forEach(function (id) { alto = Math.max(alto, pos[id].y + pos[id].h + 20); });
        lienzoSvg.setAttribute('width', 1280);
        lienzoSvg.setAttribute('height', alto);

        plano.pos = pos;
        plano.aristas = aristas;
        lienzoSvg.addEventListener('click', function (e) {
            var id = idPulsado(e);
            if (!id) { resaltarPlano(null); return; }
            resaltarPlano(id);
        });
        lienzoSvg.addEventListener('dblclick', function (e) {
            var id = idPulsado(e);
            if (id && esPagina(id) && pos[id] && !pos[id].fila) { pintarRecorrido(id); }
        });
        if (seleccion) {
            resaltarPlano(seleccion);
            var p = pos[seleccion];
            if (p) { lienzo.scrollTop = Math.max(0, p.y - 200); }
        }
    }

    function cajaSimple(padre, x, y, w, h, texto, color, id, relleno) {
        var g = svg('g', { 'class':'caja', 'data-id': id }, padre);
        svg('rect', { 'class':'fondo', x: x, y: y, width: w, height: h, rx: 6, fill: relleno ? color : '#fff', stroke: color, 'stroke-width': 1.6 }, g);
        svg('text', { x: x + 10, y: y + h / 2 + 5, 'font-size': 13, fill: relleno ? '#fff' : '#111827', 'font-weight': relleno ? 600 : 400 }, g).textContent = recortar(texto, w - 20, 13);
        svg('title', {}, g).textContent = texto + (CLASE[tipo(id)] ? ' · ' + CLASE[tipo(id)] : '') + (esBC(id) ? ' de BC' : '');
        return g;
    }

    function cajaGrupo(padre, x, y, w, h, grupo) {
        var g = svg('g', { 'data-grupo': grupo.id }, padre);
        svg('rect', { x: x, y: y, width: w, height: h, rx: 8, fill: '#fff', stroke: COLOR.menu, 'stroke-width': 1.6 }, g);
        svg('rect', { x: x, y: y, width: w, height: 34, rx: 8, fill: COLOR.menu }, g);
        svg('rect', { x: x, y: y + 26, width: w, height: 8, fill: COLOR.menu }, g);
        svg('text', { x: x + 10, y: y + 15, 'font-size': 13, 'font-weight': 700, fill: '#fff' }, g).textContent = recortar(grupo.titulo, w - 20, 13);
        svg('text', { x: x + 10, y: y + 29, 'font-size': 11, fill: '#d1d5db' }, g).textContent = recortar(grupo.sub, w - 20, 11);
        grupo.filas.forEach(function (f, i) {
            var fy = y + 40 + i * 22;
            var fg = svg('g', { 'class':'caja', 'data-id': f.id }, g);
            svg('rect', { 'class':'fondo', x: x + 4, y: fy, width: w - 8, height: 20, rx: 4, fill: i % 2 ? '#f9fafb' : '#fff' }, fg);
            var sinDestino = !f.destinos.some(function (d) { return !esBC(d); });
            svg('text', { x: x + 12, y: fy + 15, 'font-size': 12.5, fill: sinDestino ? '#9ca3af' : '#111827' }, fg).textContent = recortar(f.texto + (sinDestino && f.destinos.length ? '  (de BC)' : ''), w - 24, 12.5);
            svg('title', {}, fg).textContent = f.texto;
        });
        return g;
    }

    function idPulsado(e) {
        var g = e.target;
        while (g && g.getAttribute && !g.getAttribute('data-id')) { g = g.parentNode; }
        return g && g.getAttribute ? g.getAttribute('data-id') : null;
    }

    // Resalta lo conectado a id (hacia atrás: quién lo usa; hacia delante: qué usa) y apaga el resto.
    function resaltarPlano(id) {
        var cajas = lienzo.querySelectorAll('.caja');
        if (!id) {
            Array.prototype.forEach.call(cajas, function (c) { c.classList.remove('apagado'); });
            plano.aristas.forEach(function (a) { a.el.classList.add('oculta'); });
            plano.capaResalte.innerHTML = '';
            ayudaPlano(null);
            return;
        }
        // Hacia delante, lo que de verdad usa, función a función; hacia atrás, solo quien lo usa
        // directamente (la cadena entera hacia atrás de una tabla muy usada es media aplicación).
        var alcance = alcanceReal(id, cadenaCompleta);
        var delante = alcance.nodos, detras = {};
        detras[id] = true;
        plano.aristas.forEach(function (a) { if (a.a === id) { detras[a.de] = true; } });
        var activo = function (x) { return delante[x] || detras[x]; };
        Array.prototype.forEach.call(cajas, function (c) { c.classList.toggle('apagado', !activo(c.getAttribute('data-id'))); });
        plano.aristas.forEach(function (a) { a.el.classList.toggle('oculta', !(detras[a.de] && a.a === id)); });
        plano.capaResalte.innerHTML = '';
        alcance.aristas.forEach(function (a) { trazo(plano.capaResalte, plano.pos[a.de], plano.pos[a.a], a.k, 0.85, 1.8); });
        ayudaPlano(id, delante, detras);
    }

    // Lo que alcanza un elemento del plano siguiendo las llamadas reales, función a función: de
    // cada función solo cuenta lo que llama ella, no todo lo que hace su codeunit. Lo que se
    // dibuja es la caja visible desde la que se llama: las funciones de la propia pantalla (y de
    // sus partes) y las de las tablas se atraviesan con la caja que las llamó.
    // Sin prm_Completo se para en la primera codeunit: lo que la caja usa directamente. Con él,
    // la cadena entera, siguiendo solo lo que se puede ejecutar con los valores que llegan a cada
    // función (pasos).
    var cadenaCompleta = false;
    function alcanceReal(id, prm_Completo) {
        var res = { nodos: {}, aristas: [] }, claves = {}, vistos = {}, cola = [];
        res.nodos[id] = true;
        function encolar(m, v, ps) { ps.forEach(function (p) { cola.push([m, v, p]); }); }
        function arista(de, a, k) {
            if (!plano.pos[de] || !plano.pos[a] || de === a) { return; }
            var c = de + '|' + a + '|' + k;
            if (claves[c]) { return; }
            claves[c] = true;
            res.aristas.push({ de: de, a: a, k: k });
            res.nodos[a] = true;
        }
        function entrarEn(objeto) {
            var propios = propiosDe(objeto);
            Object.keys(propios).forEach(function (o) { (miembrosDe[o] || []).forEach(function (m) { cola.push([m, objeto, {}]); }); });
        }
        function transparente(od, v) {
            var t = tipo(od);
            if (t === 'table' || t === 'tableextension' || od === v) { return true; }
            if (esPagina(v) && partesDe(v).indexOf(od) >= 0) { return true; }
            return !!N[v] && N[v].o === od;   // fila de menú: las funciones de su propia ampliación
        }
        var t = tipo(id);
        if (esPagina(id) || t === 'codeunit') { entrarEn(id); }
        else if (N[id].o) { cola.push([id, id, {}]); }   // fila de un menú
        while (cola.length) {
            var par = cola.shift(), m = par[0], v = par[1], ctx = par[2], c = m + '|' + v + '|' + claveCtx(ctx);
            if (vistos[c]) { continue; }
            vistos[c] = true;
            N[m].e.forEach(function (a) {
                var d = a.a, td = tipo(d);
                if (!N[d]) { return; }
                var ps = pasos(a, ctx);
                if (!ps.length) { return; }
                if (a.k === 'lee' || a.k === 'escribe') { if (td === 'table' || td === 'bc-table') { arista(v, d, a.k); } return; }
                if (a.k === 'abre') {
                    if (esPagina(d) && !esParte(d)) {
                        arista(v, d, 'abre');
                        // Una opción de menú lleva a su pantalla, y con ella a todo lo que esa pantalla hace.
                        if (!esPagina(v) && tipo(v) !== 'codeunit') { entrarEn(d); }
                    }
                    return;
                }
                if (a.k === 'ejecuta') {
                    if (td === 'codeunit') { arista(v, d, 'llama'); var on = onRun(d); if (on && prm_Completo) { cola.push([on, d, {}]); } }
                    return;
                }
                if ((a.k !== 'llama' && a.k !== 'dispara') || esBC(d)) { return; }
                var od = objDe(d);
                if (transparente(od, v)) { encolar(d, v, ps); return; }
                if (tipo(od) === 'codeunit') { arista(v, od, 'llama'); if (prm_Completo) { encolar(d, od, ps); } return; }
                if (esPagina(od)) { arista(v, od, 'abre'); }
            });
        }
        return res;
    }

    // Una línea del plano entre dos cajas; en la misma columna, un arco por la derecha.
    function trazo(capa, p1, p2, k, opacidad, grosor) {
        var y1 = p1.y + p1.h / 2, y2 = p2.y + p2.h / 2, d;
        if (p1.x === p2.x) {
            var xr = p1.x + p1.w, kk = 30 + Math.min(120, Math.abs(y2 - y1) / 5);
            d = 'M' + xr + ',' + y1 + ' C' + (xr + kk) + ',' + y1 + ' ' + (xr + kk) + ',' + y2 + ' ' + xr + ',' + y2;
        } else {
            var x1 = p1.x + p1.w, x2 = p2.x, mx = (x1 + x2) / 2;
            d = 'M' + x1 + ',' + y1 + ' C' + mx + ',' + y1 + ' ' + mx + ',' + y2 + ' ' + x2 + ',' + y2;
        }
        return svg('path', { d: d, 'class': 'arista', stroke: COLOR_ARISTA[k] || '#9ca3af', 'stroke-width': grosor, opacity: opacidad, 'stroke-dasharray': k === 'lee' ? '4 3' : '' }, capa);
    }

    function ayudaPlano(id, delante, detras) {
        ayuda.innerHTML = '';
        if (!id) {
            ayuda.appendChild(textoAyuda('<b>Plano general.</b> De izquierda a derecha: los menús, las pantallas que abren, la lógica que usan y las tablas que tocan. Pulsa cualquier caja para ver con qué se conecta; doble clic en una pantalla para ver qué hace cada botón.'));
        } else {
            var cuenta = function (s) { return Object.keys(s).length - 1; };
            ayuda.appendChild(textoAyuda('<b>' + escapar(nombre(id)) + '</b> · ' + (CLASE[tipo(id)] || tipo(id)) + (esBC(id) ? ' de BC' : '') + ' · ' + (cadenaCompleta ? 'cadena completa: ' : 'lo que usa directamente: ') + cuenta(delante) + ', lo usan ' + cuenta(detras) + '. Pulsa en vacío para quitar el resaltado.'));
            if (tipo(id) !== 'table' && tipo(id) !== 'bc-table') {
                ayuda.appendChild(boton(cadenaCompleta ? 'Ver solo lo directo' : 'Ver la cadena completa', function () { cadenaCompleta = !cadenaCompleta; resaltarPlano(id); }, true));
            }
            if (esPagina(id) && !esParte(id)) { ayuda.appendChild(boton('Ver qué hace cada botón ▶', function () { pintarRecorrido(id); })); }
            var paginaFila = N[id].o && plano.grupos.some(function (g) { return g.filas.some(function (f) { return f.id === id; }); });
            if (paginaFila) {
                var destino = null;
                plano.grupos.forEach(function (g) { g.filas.forEach(function (f) { if (f.id === id) { destino = f.destinos.filter(esPagina)[0]; } }); });
                if (destino) { ayuda.appendChild(boton('Abrir el recorrido de ' + nombre(destino) + ' ▶', function () { pintarRecorrido(destino); })); }
            }
            ayuda.appendChild(boton('Detalles', function () { mostrarFicha(id); }, true));
        }
        ayuda.appendChild(leyenda());
    }

    // ---- Recorrido de una pantalla ---------------------------------------------------------

    function construirRecorrido(P) {
        var propios = propiosDe(P);
        var entradas = [];
        Object.keys(propios).forEach(function (o) {
            (miembrosDe[o] || []).forEach(function (m) {
                var t = tipo(m);
                if (t === 'trigger' || t === 'action' || t === 'field' || t === 'usercontrol') { entradas.push(m); }
            });
        });
        // Botones y campos primero en el orden de la pantalla; los triggers de la pantalla delante.
        entradas.sort(function (a, b) {
            var ta = tipo(a) === 'trigger' ? 0 : 1, tb = tipo(b) === 'trigger' ? 0 : 1;
            return ta - tb || (N[a].l || 0) - (N[b].l || 0);
        });

        // Lo que hace un miembro, atravesando las funciones propias de la pantalla. De cada
        // función de lógica a la que llega se guarda con qué valores entra (contextos[función]).
        var contextos = {};
        function directos(m) {
            var res = [], vistos = {}, pila = [[m, {}]], unicos = {};
            function anadir(a, k, ctx) {
                var c = a + '|' + k;
                if (!unicos[c]) { unicos[c] = true; res.push({ a: a, k: k }); }
                if (ctx) { (contextos[a] = contextos[a] || []).push(ctx); }
            }
            while (pila.length) {
                var par = pila.pop(), x = par[0], ctx = par[1], cx = x + '#' + claveCtx(ctx);
                if (vistos[cx]) { continue; }
                vistos[cx] = true;
                N[x].e.forEach(function (a) {
                    var d = a.a, td = tipo(d);
                    if (!N[d]) { return; }
                    var ps = pasos(a, ctx);
                    if (!ps.length) { return; }
                    if (a.k === 'lee' || a.k === 'escribe') { if (td === 'table' || td === 'bc-table') { anadir(d, a.k); } return; }
                    if (a.k === 'abre') { if (!propios[d] && (esPagina(d) || td === 'bc-page' || td === 'bc-report')) { anadir(d, 'abre'); } return; }
                    if (a.k === 'ejecuta') { if (td === 'codeunit') { anadir(onRun(d) || d, 'llama', {}); } return; }
                    if ((a.k !== 'llama' && a.k !== 'dispara') || esBC(d)) { return; }
                    var od = objDe(d);
                    if (propios[od] && (tipo(d) === 'proc' || tipo(d) === 'trigger')) { ps.forEach(function (p) { pila.push([d, p]); }); return; }
                    if (esPagina(od) && !propios[od]) { anadir(od, 'abre'); return; }
                    if (esLogica(d)) { ps.forEach(function (p) { anadir(d, 'llama', p); }); }
                });
            }
            return res;
        }

        var filas1 = [], logica = [], enLogica = {}, datos = [], enDatos = {}, aristas = [], internas = {};
        function aDatos(id) { if (!enDatos[id]) { enDatos[id] = true; datos.push(id); } }
        function aLogica(id) { if (!enLogica[id]) { enLogica[id] = true; logica.push(id); } }
        entradas.forEach(function (m) {
            var ds = directos(m);
            if (!ds.length) { return; }
            filas1.push(m);
            ds.forEach(function (d) {
                if (esLogica(d.a)) { aLogica(d.a); } else { aDatos(d.a); }
                aristas.push({ de: m, a: d.a, k: d.k });
            });
        });
        // De cada función que usa la pantalla, solo se dibuja lo que toca al final (tablas y
        // pantallas), sumando todo lo que hace por dentro; las funciones internas se cuentan.
        // Solo se sigue lo que se puede ejecutar con los valores con que la llama la pantalla.
        logica.forEach(function (m) {
            var vistos = {}, funciones = {}, cola = [], tab = {}, pag = {};
            (contextos[m] || [{}]).forEach(function (ctx) { cola.push([m, ctx]); });
            funciones[m] = true;
            while (cola.length) {
                var par = cola.shift(), cx = par[0] + '#' + claveCtx(par[1]);
                if (vistos[cx]) { continue; }
                vistos[cx] = true;
                directosLogica(par[0], par[1]).forEach(function (d) {
                    if (esLogica(d.a)) { funciones[d.a] = true; cola.push([d.a, d.ctx]); }
                    else if (d.k === 'abre') { pag[d.a] = true; }
                    else { tab[d.a] = (tab[d.a] === 'escribe' || d.k === 'escribe') ? 'escribe' : 'lee'; }
                });
            }
            internas[m] = Object.keys(funciones).length - 1;
            Object.keys(tab).forEach(function (t) { aDatos(t); aristas.push({ de: m, a: t, k: tab[t] }); });
            Object.keys(pag).forEach(function (p) { aDatos(p); aristas.push({ de: m, a: p, k: 'abre' }); });
        });
        function directosLogica(m, ctx) {
            var res = [];
            N[m].e.forEach(function (a) {
                var d = a.a, td = tipo(d);
                if (!N[d]) { return; }
                var ps = pasos(a, ctx);
                if (!ps.length) { return; }
                if (a.k === 'lee' || a.k === 'escribe') { if (td === 'table' || td === 'bc-table') { res.push({ a: d, k: a.k }); } return; }
                if (a.k === 'abre') { if (esPagina(d) || td === 'bc-page' || td === 'bc-report') { res.push({ a: d, k: 'abre' }); } return; }
                if (a.k === 'ejecuta') { if (td === 'codeunit') { res.push({ a: onRun(d) || d, k: 'llama', ctx: {} }); } return; }
                if ((a.k !== 'llama' && a.k !== 'dispara') || esBC(d)) { return; }
                if (esLogica(d)) { ps.forEach(function (p) { res.push({ a: d, k: 'llama', ctx: p }); }); return; }
                var od = objDe(d);
                if (esPagina(od)) { res.push({ a: od, k: 'abre' }); }
            });
            return res;
        }

        // Cajas de lógica: una por codeunit (o tabla con funciones), con sus funciones dentro.
        var cajas = [], porObjeto = {};
        logica.forEach(function (m) {
            var o = objDe(m);
            if (!porObjeto[o]) { porObjeto[o] = { id: o, filas: [] }; cajas.push(porObjeto[o]); }
            porObjeto[o].filas.push(m);
        });
        return { pagina: P, partes: partesDe(P), filas1: filas1, cajas: cajas, datos: datos, aristas: aristas, internas: internas };
    }

    function pintarRecorrido(P, marcar) {
        var r = construirRecorrido(P);
        vista = { tipo: 'recorrido', pagina: P };
        migas([{ texto: 'Plano general', ir: function () { pintarPlano(P); } }, { texto: nombre(P) }]);
        ayuda.innerHTML = '';
        ayuda.appendChild(textoAyuda('<b>' + escapar(nombre(P)) + '.</b> Cada botón o campo de la pantalla, la lógica que usa y las tablas que lee o escribe (y las pantallas que abre). Pasa el ratón por un botón para seguir solo su camino; pulsa cualquier cosa para ver sus detalles.'));
        ayuda.appendChild(boton('← Plano general', function () { pintarPlano(P); }, true));
        ayuda.appendChild(leyenda());

        var X = [20, 300, 630, 1030], W = [240, 290, 340, 240];
        var lienzoSvg = nuevoSvg();
        var capaAristas = svg('g', {}, lienzoSvg), capaCajas = svg('g', {}, lienzoSvg);

        });

        // Carril 1: la pantalla, con sus subpantallas y su tabla.
        var extra = r.partes.map(function (p) { return 'Contiene: ' + nombre(p); });
        N[P].e.forEach(function (a) { if (a.k === 'tabla') { extra.push('Tabla: ' + nombre(a.a)); } });
        var altoP = extra.length ? 44 + extra.length * 20 + 8 : 40;
        var gp = cajaSimple(capaCajas, X[0], ARRIBA, W[0], 40, nombre(P), colorObjeto(P), P, true);

            pos[m].el = cajaSimple(capaCajas, X[1], y, W[1], 30, t, tipo(m) === 'trigger' ? '#7c3aed' : COLOR.accion, m, false);
        });

        // Carril 3: cajas de lógica, cerca de quien las usa.
        function mediaFuentes(ids) {
            var s = 0, k = 0;
            r.aristas.forEach(function (a) { if (ids.indexOf(a.a) >= 0 && pos[a.de]) { s += pos[a.de].y; k++; } });
            return k ? s / k : 0;
        }
        var y3 = ARRIBA;
        r.cajas.forEach(function (c) {
            var alto = 30 + c.filas.length * 22 + 6;
            var deseada = Math.max(y3, mediaFuentes(c.filas) - alto / 2);
            c.y = deseada;
            y3 = deseada + alto + 14;
            var g = svg('g', {}, capaCajas);
            var color = colorObjeto(c.id);
            svg('rect', { x: X[2], y: c.y, width: W[2], height: alto, rx: 8, fill: '#fff', stroke: color, 'stroke-width': 1.6 }, g);
            var cab = svg('g', { 'class':'caja', 'data-id': c.id }, g);
            svg('rect', { 'class':'fondo', x: X[2], y: c.y, width: W[2], height: 26, rx: 8, fill: color }, cab);
            svg('rect', { x: X[2], y: c.y + 18, width: W[2], height: 8, fill: color }, cab);
            svg('text', { x: X[2] + 10, y: c.y + 18, 'font-size': 13, 'font-weight': 700, fill: '#fff' }, cab).textContent = recortar(nombre(c.id) + (tipo(c.id) === 'codeunit' ? '' : ' (funciones de la tabla)'), W[2] - 20, 13);
            svg('title', {}, cab).textContent = nombre(c.id);
            c.filas.forEach(function (m, i) {
                var fy = c.y + 30 + i * 22;
                pos[m] = { x: X[2], y: fy, w: W[2], h: 20 };
                var fg = svg('g', { 'class':'caja', 'data-id': m }, g);
                svg('rect', { 'class':'fondo', x: X[2] + 4, y: fy, width: W[2] - 8, height: 20, rx: 4, fill: i % 2 ? '#f9fafb' : '#fff' }, fg);
                var mas = r.internas[m] ? '  (+' + r.internas[m] + ' por dentro)' : '';
                svg('text', { x: X[2] + 12, y: fy + 15, 'font-size': 12.5, fill: '#111827' }, fg).textContent = recortar(textoFila(m) + mas, W[2] - 24, 12.5);
                svg('title', {}, fg).textContent = textoFila(m) + (mas ? ': usa ' + r.internas[m] + ' funciones más por dentro (pulsa para verlas)' : '');
                pos[m].el = fg;
            });
        });

        // Carril 4: tablas y pantallas, cerca de quien las usa.
        var y4 = colocar(r.datos.slice(), function (d) { return mediaFuentes([d]) - 15; }, 30, 8, ARRIBA);
        r.datos.forEach(function (d) {
            pos[d] = { x: X[3], y: y4[d], w: W[3], h: 30 };
            var t = nombre(d);
            if (esPagina(d) || tipo(d) === 'bc-page' || tipo(d) === 'bc-report') { t = 'Abre: ' + t; }
            pos[d].el = cajaSimple(capaCajas, X[3], y4[d], W[3], 30, t, colorObjeto(d), d, tipo(d) === 'table');
        });

        // Aristas.
        var lista = [];
        r.aristas.forEach(function (a) {
            var p1 = pos[a.de], p2 = pos[a.a];
            if (!p1 || !p2) { return; }
            var y1 = p1.y + p1.h / 2, y2 = p2.y + p2.h / 2;
            var x1 = p1.x + p1.w, x2 = p2.x, mx = (x1 + x2) / 2;
            var d = 'M' + x1 + ',' + y1 + ' C' + mx + ',' + y1 + ' ' + mx + ',' + y2 + ' ' + x2 + ',' + y2;
            a.el = svg('path', { d: d, 'class': 'arista', stroke: COLOR_ARISTA[a.k] || '#9ca3af', 'stroke-width': 1.4, opacity: 0.55, 'stroke-dasharray': a.k === 'lee' ? '4 3' : '', 'marker-end': 'url(#punta-' + (a.k in COLOR_ARISTA ? a.k : 'usa') + ')' }, capaAristas);
            lista.push(a);
        });

        var alto = ARRIBA + altoP;
        Object.keys(pos).forEach(function (id) { alto = Math.max(alto, pos[id].y + pos[id].h + 30); });
        lienzoSvg.setAttribute('width', 1300);
        lienzoSvg.setAttribute('height', alto);

        // Pasar por un botón: solo su camino.
        function camino(desde) {
            var si = {};
            si[desde] = true;
            var cambio = true;
            while (cambio) {
                cambio = false;
                lista.forEach(function (a) { if (si[a.de] && !si[a.a]) { si[a.a] = true; cambio = true; } });
            }
            return si;
        }
        function resaltar(desde) {
            var si = desde ? camino(desde) : null;
            lista.forEach(function (a) {
                var on = !si || (si[a.de] && si[a.a]);
                a.el.setAttribute('opacity', si ? (on ? 0.95 : 0.05) : 0.55);
                a.el.setAttribute('stroke-width', si && on ? 2.2 : 1.4);
            });
            // La cabecera de una caja de lógica sigue encendida si lo está alguna de sus funciones.
            var objetos = {};
            if (si) { Object.keys(si).forEach(function (x) { objetos[objDe(x)] = true; }); }
            Array.prototype.forEach.call(lienzoSvg.querySelectorAll('.caja'), function (c) {
                var id = c.getAttribute('data-id');
                c.classList.toggle('apagado', !!si && !si[id] && !objetos[id] && id !== P);
            });
        }
        r.filas1.forEach(function (m) {
            pos[m].el.addEventListener('mouseenter', function () { resaltar(m); });
            pos[m].el.addEventListener('mouseleave', function () { resaltar(marcado); });
        });
        var marcado = null;
        lienzoSvg.addEventListener('click', function (e) {
            var id = idPulsado(e);
            if (!id) { marcado = null; resaltar(null); cerrarFicha(); return; }
            if (r.filas1.indexOf(id) >= 0) { marcado = id; resaltar(id); }
            if ((esPagina(id) && id !== P && !esParte(id))) { pintarRecorrido(id); return; }
            mostrarFicha(id);
        });
        if (marcar && pos[marcar]) {
            var fuentes = {};
            r.aristas.forEach(function (a) { fuentes[a.a] = fuentes[a.a] || []; fuentes[a.a].push(a.de); });
            var raiz = marcar;
            while (fuentes[raiz] && r.filas1.indexOf(raiz) < 0) { raiz = fuentes[raiz][0]; }
            marcado = r.filas1.indexOf(raiz) >= 0 ? raiz : null;
            resaltar(marcado);
            pos[marcar].el.querySelector('rect').setAttribute('stroke', '#111827');
            pos[marcar].el.querySelector('rect').setAttribute('stroke-width', 3);
            lienzo.scrollTop = Math.max(0, pos[marcar].y - 200);

    }

    // ---- Comunes -----------------------------------------------------------------------------

    var vista = null;

    // ---- Buscador y código sin acceso ------------------------------------------------------

    var buscar = document.getElementById('buscar');

    var TILDES = new RegExp('[' + String.fromCharCode(0x300) + '-' + String.fromCharCode(0x36f) + ']', 'g');
    function normal(s) { return (s || '').toLowerCase().normalize('NFD').replace(TILDES, ''); }
    var indice = Object.keys(N).filter(function (id) { var t = tipo(id); return t !== 'raiz' && t !== 'menu' && t !== 'profile'; }).map(function (id) {

        var hallados = indice.filter(function (x) { return palabras.every(function (p) { return x.texto.indexOf(p) >= 0; }); });
        hallados.sort(function (a, b) { return (N[a.id].o ? 1 : 0) - (N[b.id].o ? 1 : 0); });
        hallados.slice(0, 50).forEach(function (x) {
            var d = el('div');

    // Código al que no se llega desde ninguna entrada (menús, pantallas, eventos).
    (function () {
        var vistos = {}, cola = DATOS.raices.slice();
        cola.forEach(function (r) { vistos[r] = true; });
        Object.keys(N).forEach(function (id) { if (esPagina(id) || tipo(id) === 'pageextension') { vistos[id] = true; cola.push(id); } });
        while (cola.length) {
            var id = cola.shift();
            N[id].e.forEach(function (a) { if (!vistos[a.a] && N[a.a] && a.k !== 'lee' && a.k !== 'escribe') { vistos[a.a] = true; cola.push(a.a); } });
        }
        var CODIGO = { proc: 1, trigger: 1, action: 1, field: 1, usercontrol: 1, suscriptor: 1 };
        var sin = Object.keys(N).filter(function (id) { return CODIGO[tipo(id)] && !vistos[id]; });
        var s = document.getElementById('sinacceso');
        if (!sin.length) { return; }
        s.textContent = sin.length + ' sin acceso desde menú';
        s.title = 'Código al que no se llega desde ningún menú ni pantalla: lo lanza la cola de proyectos o sobra.';
        s.addEventListener('click', function () {
            ficha.innerHTML = '';
            ficha.style.display = 'block';
            var x = el('span', 'cerrar', '×');
            x.addEventListener('click', cerrarFicha);
            ficha.appendChild(x);
            ficha.appendChild(el('h2', null, 'Sin acceso desde menú'));
            ficha.appendChild(el('div', 'sub', 'No se llega a esto desde ningún menú, pantalla ni evento. O lo lanza algo que el mapa no ve (la cola de proyectos, por ejemplo), o sobra.'));
            listaFicha('Elementos', sin.map(function (id) { return { id: id }; }));
        });
    })();

    // MapaSGA.html#id abre un elemento; #plano:id lo resalta en el plano general.
    var inicial = decodeURIComponent(location.hash.substring(1));
    var enPlano = inicial.indexOf('plano:') === 0;
    if (enPlano) { inicial = inicial.substring(6); }
    if (!N[inicial]) { pintarPlano(null); }
    else if (enPlano) { pintarPlano(inicial); }
    else { construirPlano(); ir(inicial); }
})();
</script>
